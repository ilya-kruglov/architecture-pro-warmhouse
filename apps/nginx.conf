events {
    worker_connections 1024;
}

http {
    upstream monolith {
        server app:8080;
    }

    upstream device_service {
        server device-service:8082;
    }

    upstream telemetry_service {
        server telemetry-service:8083;
    }

    upstream temperature_api {
        server temperature-api:8081;
    }

    server {
        listen 80;
        server_name localhost;

        # Health checks
        location /health {
            proxy_pass http://monolith/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Монолит (legacy API)
        location /api/v1/ {
            proxy_pass http://monolith/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Device Service (новый микросервис)
        location /api/v2/devices {
            proxy_pass http://device_service/devices;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Преобразование запросов для совместимости
            if ($request_method = POST) {
                rewrite ^/api/v2/devices$ /devices break;
                proxy_pass http://device_service;
            }
        }

        # Telemetry Service (новый микросервис)
        location /api/v2/telemetry {
            proxy_pass http://telemetry_service/telemetry;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Temperature API
        location /api/temperature {
            proxy_pass http://temperature_api/temperature;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Прямой доступ к сервисам (для отладки)
        location /device-service/ {
            rewrite ^/device-service/(.*) /$1 break;
            proxy_pass http://device_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /telemetry-service/ {
            rewrite ^/telemetry-service/(.*) /$1 break;
            proxy_pass http://telemetry_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Default
        location / {
            proxy_pass http://monolith;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}